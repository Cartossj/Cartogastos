<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Mis Gastos</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#141a22;--mu:#6a7583;--bd:#e3e7ec;--pr:#0f766e;--on:#fff;--rd:#dc2626;--gr:#16a34a;--am:#d97706;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#171c24;--tx:#e8ebf0;--mu:#8b95a3;--bd:#262d38;--pr:#2dd4bf;--on:#04201c;--rd:#f87171;--gr:#4ade80;--am:#fbbf24}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#171c24;--tx:#e8ebf0;--mu:#8b95a3;--bd:#262d38;--pr:#2dd4bf;--on:#04201c;--rd:#f87171;--gr:#4ade80;--am:#fbbf24}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,sans-serif}
main{max-width:560px;margin:0 auto;padding:12px 14px 120px}
h2{font-size:15px;margin:18px 0 8px}small,.mu{color:var(--mu);font-size:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.grid .card{margin:0}
.acc b{display:block;font-size:17px;margin-top:2px}
.row3{display:flex;justify-content:space-between;gap:6px}.row3 b{display:block;font-size:16px}
.pos{color:var(--gr)}.neg{color:var(--rd)}
.msg{margin:8px 0 0;font-size:13px}
.ban{background:var(--am);color:#fff;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:13px}
.mn{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;text-transform:capitalize}
.mn button,.ib{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:10px;width:40px;height:36px;font-size:18px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;border-radius:6px}
.cr{margin-bottom:12px}.cr div:first-child{display:flex;justify-content:space-between}
.tr{display:flex;align-items:flex-end;gap:8px;height:110px}.tr div{flex:1;text-align:center;font-size:11px;color:var(--mu)}
.tr span{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:84px}.tr i{width:11px;border-radius:3px 3px 0 0;min-height:2px}
.tx{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.tx:last-child{border:0}
.tx .ic{font-size:22px;width:32px;text-align:center}.tx .m{flex:1;min-width:0}.tx .m div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day{font-size:12px;color:var(--mu);margin:14px 0 4px;text-transform:capitalize}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:10px 0 8px;font-size:11px}nav button span{display:block;font-size:20px}nav button.on{color:var(--pr);font-weight:600}
.fab{position:fixed;right:18px;bottom:calc(72px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--pr);color:var(--on);font-size:32px;box-shadow:0 4px 14px #0005;z-index:6}
.sh{position:fixed;inset:0;background:#0008;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sh>div{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px))}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}.seg button.on{background:var(--pr);color:var(--on);border-color:var(--pr)}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
#fa{font-size:30px;font-weight:700;text-align:center;padding:12px}
.ch{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}.ch button{padding:8px 11px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:14px}.ch button.on{background:var(--pr);color:var(--on);border-color:var(--pr)}
label{display:block;font-size:12px;color:var(--mu);margin-top:6px}
.btn{width:100%;padding:13px;border-radius:12px;border:0;background:var(--pr);color:var(--on);font-size:16px;font-weight:600;margin-top:8px}.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.d{background:var(--rd);color:#fff}
.set{display:flex;gap:8px;align-items:center;margin-bottom:8px}.set label{flex:1;margin:0;font-size:14px;color:var(--tx)}.set input{width:120px;text-align:right}
#toast{position:fixed;left:14px;right:14px;top:calc(12px + env(safe-area-inset-top,0px));background:#111;color:#fff;border-radius:12px;padding:12px;z-index:20;display:none;font-size:14px;box-shadow:0 4px 16px #0006}
</style></head><body>
<div id="toast"></div><main id="v"></main>
<button class="fab" onclick="openForm()" aria-label="Nuevo">+</button>
<nav id="nv"></nav><div id="sh"></div>
<script>
const KEY='gastos_v1';let S,tab='h',mo,F;
const $=i=>document.getElementById(i);
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
// Dinero SIEMPRE en céntimos enteros
const money=(c,k)=>{const n=c<0;c=Math.abs(c);return (n?'-':'')+(k==='USD'?'US$ ':'S/ ')+Math.floor(c/100).toLocaleString('en-US')+'.'+p2(c%100)};
const toC=s=>{s=String(s).trim().replace(',','.');if(!/^\d+(\.\d{1,2})?$/.test(s))return null;const a=s.split('.');return (+a[0])*100+(+((a[1]||'')+'00').slice(0,2))};
const dec=c=>Math.floor(c/100)+'.'+p2(c%100);
function seed(){return{accounts:[{id:'yape',name:'Yape/BCP',cur:'PEN',init:0},{id:'efe',name:'Efectivo',cur:'PEN',init:0},{id:'bet',name:'Betano',cur:'PEN',init:0},{id:'dale',name:'Dale',cur:'PEN',init:0},{id:'wf',name:'Wells Fargo',cur:'USD',init:0}],
cats:[['comida','Comida','e','🍽️'],['transp','Transporte','e','🚌'],['casa','Casa y servicios','e','🏠'],['salud','Salud','e','💊'],['ocio','Ocio','e','🎬'],['compras','Compras','e','🛍️'],['apuestas','Apuestas','e','🎰'],['otros','Otros gastos','e','📦'],['sueldo','Sueldo','i','💼'],['otroi','Otros ingresos','i','💰'],['premio','Ganancia apuestas','i','🏆']].map(c=>({id:c[0],name:c[1],type:c[2],icon:c[3],budget:0})),tx:[],last:null}}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.tx)S=seed();
mo=today().slice(0,7);
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('⚠️ No pude guardar en el teléfono. Haz un respaldo.')}}
const acc=id=>S.accounts.find(a=>a.id===id)||{name:'?',cur:'PEN'};
const cur=id=>acc(id).cur;
const cat=id=>S.cats.find(c=>c.id===id)||{name:'?',icon:'❔',budget:0};
function bal(a){let b=a.init;for(const t of S.tx){if(t.acc===a.id)b+=t.type==='i'?t.amt:-t.amt;if(t.type==='t'&&t.to===a.id)b+=t.amtTo||t.amt}return b}
function stats(m){const r={PEN:{i:0,e:0},USD:{i:0,e:0},cat:{}};for(const t of S.tx){if(t.date.slice(0,7)!==m||t.type==='t')continue;const k=cur(t.acc);r[k][t.type]+=t.amt;if(t.type==='e'&&k==='PEN')r.cat[t.cat]=(r.cat[t.cat]||0)+t.amt}return r}
const mname=m=>{const a=m.split('-');return new Date(+a[0],+a[1]-1,1).toLocaleDateString('es-PE',{month:'long',year:'numeric'})};
const shiftM=(m,d)=>{const a=m.split('-');const x=new Date(+a[0],+a[1]-1+d,1);return x.getFullYear()+'-'+p2(x.getMonth()+1)};
let tt;function toast(m,ms){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',ms||2800)}
function notify(t,b){toast(t+' — '+b,5000);try{if(window.Notification&&Notification.permission==='granted'&&navigator.serviceWorker)navigator.serviceWorker.ready.then(r=>r.showNotification(t,{body:b,icon:'icon-192.png'}))}catch(e){}}
function sh(d){mo=shiftM(mo,d);render()}
const mnav=()=>`<div class="mn"><button onclick="sh(-1)">‹</button><b>${mname(mo)}</b><button onclick="sh(1)">›</button></div>`;

function render(){
 $('nv').innerHTML=[['h','📊','Inicio'],['m','🧾','Movimientos'],['c','🏷️','Categorías'],['a','⚙️','Ajustes']].map(x=>`<button class="${tab===x[0]?'on':''}" onclick="tab='${x[0]}';render();scrollTo(0,0)"><span>${x[1]}</span>${x[2]}</button>`).join('');
 $('v').innerHTML={h:home,m:movs,c:cats,a:ajustes}[tab]();
}
function home(){
 const st=stats(mo),p=st.PEN,u=st.USD,sv=p.i-p.e;let h='';
 if(!S.tx.length&&S.accounts.every(a=>!a.init))h+=`<div class="ban">👋 Primero ve a ⚙️ Ajustes y pon el saldo actual de cada cuenta. Así tus números cuadran desde el día 1.</div>`;
 else if(!S.tx.some(t=>t.date===today()))h+=`<div class="ban">📝 Hoy aún no registras nada. ¿Gastaste o recibiste algo?</div>`;
 h+=mnav()+`<div class="grid">`+S.accounts.map(a=>{const b=bal(a);return `<div class="card acc"><small>${E(a.name)}</small><b class="${b<0?'neg':''}">${money(b,a.cur)}</b></div>`}).join('')+`</div>`;
 h+=`<div class="card"><div class="row3"><div><small>Ingresos</small><b class="pos">${money(p.i)}</b></div><div><small>Gastos</small><b class="neg">${money(p.e)}</b></div><div><small>Ahorro</small><b class="${sv<0?'neg':'pos'}">${money(sv)}</b></div></div>`;
 if(u.i||u.e)h+=`<div class="msg mu">Wells Fargo: ingresos ${money(u.i,'USD')} · gastos ${money(u.e,'USD')}</div>`;
 h+=`<p class="msg">${sv>0?`🎉 Ahorraste ${money(sv)} este mes.`:sv<0?`⚠️ Gastaste ${money(-sv)} más de lo que ingresó.`:'Aún sin ahorro este mes.'}</p></div>`;
 const rows=S.cats.filter(c=>c.type==='e'&&((st.cat[c.id]||0)>0||c.budget>0)).sort((a,b)=>(st.cat[b.id]||0)-(st.cat[a.id]||0));
 const mx=Math.max(1,...rows.map(c=>st.cat[c.id]||0));
 h+=`<h2>Gastos por categoría (S/)</h2><div class="card">`+(rows.length?rows.map(c=>{const s=st.cat[c.id]||0,pc=c.budget?s/c.budget:0,w=c.budget?Math.min(100,pc*100):s/mx*100,col=!c.budget?'var(--pr)':pc>=1?'var(--rd)':pc>=.8?'var(--am)':'var(--gr)';
  return `<div class="cr"><div><span>${c.icon} ${E(c.name)}</span><span>${money(s)}${c.budget?` / ${money(c.budget)}`:''}</span></div><div class="bar"><i style="width:${w}%;background:${col}"></i></div>${c.budget?`<small>${pc>=1?'🚫 Límite superado por '+money(s-c.budget):pc>=.8?'⚠️ Cerca del límite, quedan '+money(c.budget-s):'✅ Vas bien, quedan '+money(c.budget-s)}</small>`:''}</div>`}).join(''):'<span class="mu">Sin gastos este mes.</span>')+`</div>`;
 const ms=[];for(let i=5;i>=0;i--)ms.push(shiftM(mo,-i));
 const ss=ms.map(m=>stats(m).PEN),M=Math.max(1,...ss.map(x=>Math.max(x.i,x.e)));
 h+=`<h2>Últimos 6 meses (S/)</h2><div class="card"><div class="tr">`+ms.map((m,i)=>`<div><span><i style="height:${ss[i].i/M*100}%;background:var(--gr)"></i><i style="height:${ss[i].e/M*100}%;background:var(--rd)"></i></span>${new Date(+m.slice(0,4),+m.slice(5)-1,1).toLocaleDateString('es-PE',{month:'short'})}</div>`).join('')+`</div><small><span class="pos">■</span> ingresos <span class="neg">■</span> gastos</small></div>`;
 return h}
function movs(){
 const L=S.tx.filter(t=>t.date.slice(0,7)===mo).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(a.id<b.id?1:-1));
 let h=mnav(),d='';if(!L.length)return h+'<div class="card mu">Sin movimientos este mes. Toca + para registrar.</div>';
 h+='<div class="card">';
 for(const t of L){if(t.date!==d){d=t.date;const a=d.split('-');h+=`<div class="day">${new Date(+a[0],+a[1]-1,+a[2]).toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'short'})}</div>`}
  const k=cur(t.acc),tr=t.type==='t',c=cat(t.cat);
  h+=`<div class="tx" onclick="openForm('${t.id}')"><div class="ic">${tr?'🔁':c.icon}</div><div class="m"><div>${tr?'Transferencia':E(c.name)}</div><small>${E(acc(t.acc).name)}${tr?' → '+E(acc(t.to).name):''}${t.note?' · '+E(t.note):''}</small></div><b class="${t.type==='i'?'pos':t.type==='e'?'neg':''}">${t.type==='i'?'+':t.type==='e'?'-':''}${money(t.amt,k)}</b></div>`}
 return h+'</div>'}
function cats(){
 const row=c=>`<div class="set"><label>${c.icon} ${E(c.name)}</label>${c.type==='e'?`<input inputmode="decimal" placeholder="Sin límite" value="${c.budget?dec(c.budget):''}" onchange="setBud('${c.id}',this)">`:''}<button class="ib" onclick="delCat('${c.id}')">🗑</button></div>`;
 return `<h2>Gastos · presupuesto mensual (S/)</h2><div class="card">${S.cats.filter(c=>c.type==='e').map(row).join('')}</div><h2>Ingresos</h2><div class="card">${S.cats.filter(c=>c.type==='i').map(row).join('')}</div><h2>Nueva categoría</h2><div class="card"><input id="nc" placeholder="Nombre (ej. Mascotas)"><label>Tipo</label><select id="nt"><option value="e">Gasto</option><option value="i">Ingreso</option></select><button class="btn" onclick="addCat()">Agregar</button></div>`}
function setBud(id,el){const v=el.value.trim()===''?0:toC(el.value);if(v===null){toast('Monto inválido');return render()}cat(id).budget=v;save();toast('Presupuesto guardado')}
function addCat(){const n=$('nc').value.trim();if(!n)return toast('Escribe un nombre');S.cats.push({id:uid(),name:n,type:$('nt').value,icon:$('nt').value==='e'?'🏷️':'💵',budget:0});save();render()}
function delCat(id){if(S.tx.some(t=>t.cat===id))return toast('No se puede: tiene movimientos');S.cats=S.cats.filter(c=>c.id!==id);save();render()}
function ajustes(){
 return `<h2>Saldos iniciales (lo que tienes hoy)</h2><div class="card">${S.accounts.map(a=>`<div class="set"><label>${E(a.name)} (${a.cur==='USD'?'US$':'S/'})</label><input inputmode="decimal" value="${dec(a.init)}" onchange="setInit('${a.id}',this)"></div>`).join('')}</div>
 <h2>Avisos</h2><div class="card"><button class="btn s" onclick="askNotif()">🔔 Activar notificaciones</button><small>Las alertas de límite siempre salen en pantalla al registrar un gasto. Las notificaciones del sistema dependen de tu navegador.</small></div>
 <h2>Reportes y respaldo</h2><div class="card"><button class="btn" onclick="expCSV(mo)">⬇️ Reporte de ${mname(mo)} (CSV)</button><button class="btn s" onclick="expCSV()">⬇️ Todos los movimientos (CSV)</button><button class="btn s" onclick="expJSON()">💾 Respaldo completo (JSON)</button><label>Restaurar respaldo</label><input type="file" accept=".json,application/json" onchange="impJSON(this)"></div>
 <h2>Zona peligrosa</h2><div class="card"><button class="btn d" onclick="wipe()">🗑 Borrar toda la base de datos</button></div>
 <p class="mu" style="text-align:center">${S.tx.length} movimientos guardados en este teléfono</p>`}
function setInit(id,el){const v=toC(el.value);if(v===null){toast('Monto inválido');return render()}acc(id).init=v;save();toast('Saldo inicial guardado')}
function askNotif(){try{Notification.requestPermission().then(r=>toast(r==='granted'?'Notificaciones activadas':'Permiso no concedido'))}catch(e){toast('Tu navegador no lo permite aquí')}}
function dl(name,text,mime){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Descargado ✔ Revisa tu carpeta Descargas',4000)}catch(e){toast('No se pudo descargar')}}
function expCSV(m){
 const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
 const L=S.tx.filter(t=>!m||t.date.slice(0,7)===m).sort((a,b)=>a.date<b.date?-1:1);
 let c='\ufeffFecha,Tipo,Cuenta,Cuenta destino,Categoria,Monto,Moneda,Monto recibido,Nota\n';
 for(const t of L)c+=[t.date,{e:'Gasto',i:'Ingreso',t:'Transferencia'}[t.type],q(acc(t.acc).name),q(t.to?acc(t.to).name:''),q(t.cat?cat(t.cat).name:''),dec(t.amt),cur(t.acc),t.amtTo?dec(t.amtTo):'',q(t.note)].join(',')+'\n';
 const st=stats(m||'x');
 dl(m?`reporte-${m}.csv`:'movimientos.csv',c,'text/csv')}
function expJSON(){dl('respaldo-gastos-'+today()+'.json',JSON.stringify(S),'application/json')}
function impJSON(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.accounts||!j.cats||!j.tx)throw 0;S=j;save();render();toast('Respaldo restaurado')}catch(e){toast('Archivo inválido')}};r.readAsText(f)}
function wipe(){openSheet(`<h2>¿Borrar TODO?</h2><p>Se eliminan todos los movimientos, saldos y categorías. No se puede deshacer. Haz un respaldo antes.</p><button class="btn s" onclick="expJSON()">💾 Respaldar primero</button><label>Escribe BORRAR para confirmar</label><input id="wc" autocomplete="off"><button class="btn d" onclick="if($('wc').value.trim().toUpperCase()==='BORRAR'){S=seed();save();closeSheet();render();toast('Base de datos borrada')}else toast('Escribe BORRAR')">Borrar definitivamente</button><button class="btn s" onclick="closeSheet()">Cancelar</button>`)}
const openSheet=h=>{$('sh').innerHTML=`<div class="sh" onclick="if(event.target===this)closeSheet()"><div>${h}</div></div>`};
const closeSheet=()=>{$('sh').innerHTML=''};

function openForm(id){const t=id?S.tx.find(x=>x.id===id):null;
 F=t?Object.assign({},t,{amtS:dec(t.amt),toS:t.amtTo?dec(t.amtTo):'',to:t.to||'',cat:t.cat||'',eid:id}):{type:'e',date:today(),acc:(S.last&&S.last.acc)||S.accounts[0].id,cat:'',note:'',amtS:'',to:'',toS:'',eid:null};
 form();if(!t)setTimeout(()=>{const a=$('fa');a&&a.focus()},50)}
function sync(){const g=$;if(g('fa')){F.amtS=g('fa').value;F.date=g('fd').value;F.note=g('fn').value;if(g('ft'))F.toS=g('ft').value}}
function setF(k,v){sync();F[k]=v;if(k==='type'){F.cat='';F.to=''}form()}
function form(){
 const ty=F.type,chips=(arr,k,sel)=>`<div class="ch">${arr.map(x=>`<button class="${sel===x.id?'on':''}" onclick="setF('${k}','${x.id}')">${x.n}</button>`).join('')}</div>`;
 const accs=S.accounts.map(a=>({id:a.id,n:E(a.name)+(a.cur==='USD'?' (US$)':'')}));
 let h=`<div class="seg">${[['e','Gasto'],['i','Ingreso'],['t','Transferir']].map(x=>`<button class="${ty===x[0]?'on':''}" onclick="setF('type','${x[0]}')">${x[1]}</button>`).join('')}</div>
 <input id="fa" inputmode="decimal" placeholder="${cur(F.acc)==='USD'?'US$ 0.00':'S/ 0.00'}" value="${E(F.amtS)}">
 <label>${ty==='t'?'Desde':'Cuenta'}</label>${chips(accs,'acc',F.acc)}`;
 if(ty==='t'){h+=`<label>Hacia</label>${chips(accs.filter(a=>a.id!==F.acc),'to',F.to)}`;
  if(F.to&&cur(F.to)!==cur(F.acc))h+=`<label>Monto que llegó (${cur(F.to)==='USD'?'US$':'S/'})</label><input id="ft" inputmode="decimal" value="${E(F.toS)}">`}
 else h+=`<label>Categoría</label>${chips(S.cats.filter(c=>c.type===ty).map(c=>({id:c.id,n:c.icon+' '+E(c.name)})),'cat',F.cat)}`;
 h+=`<label>Fecha</label><input id="fd" type="date" value="${F.date}"><label>Nota (opcional)</label><input id="fn" value="${E(F.note)}" placeholder="Ej. almuerzo con Juan">
 <button class="btn" onclick="submitF()">Guardar</button>${F.eid?`<button class="btn d" onclick="delTx()">Eliminar movimiento</button>`:''}<button class="btn s" onclick="closeSheet()">Cancelar</button>`;
 openSheet(h)}
function submitF(){sync();const amt=toC(F.amtS);
 if(!amt||amt<=0)return toast('Monto inválido (ej. 12.50)');
 let amtTo=0;
 if(F.type==='t'){if(!F.to||F.to===F.acc)return toast('Elige la cuenta destino');if(cur(F.to)!==cur(F.acc)){amtTo=toC(F.toS);if(!amtTo)return toast('Indica el monto que llegó')}}
 else if(!F.cat)return toast('Elige una categoría');
 if(!F.date)return toast('Elige la fecha');
 const t={id:F.eid||uid(),type:F.type,date:F.date,acc:F.acc,amt:amt,note:F.note.trim()};
 if(F.type==='t'){t.to=F.to;if(amtTo)t.amtTo=amtTo}else t.cat=F.cat;
 if(F.eid)S.tx[S.tx.findIndex(x=>x.id===F.eid)]=t;else S.tx.push(t);
 S.last={acc:F.acc};save();closeSheet();mo=t.date.slice(0,7);render();
 if(t.type==='e'&&cur(t.acc)==='PEN'){const c=cat(t.cat);if(c.budget>0){const s=stats(mo).cat[t.cat]||0,pc=s/c.budget;
  if(pc>=1)notify('🚫 Llegaste al límite en '+c.name,'Llevas '+money(s)+' de '+money(c.budget));
  else if(pc>=.8)notify('⚠️ Casi al límite en '+c.name,'Te quedan '+money(c.budget-s));
  else notify('✅ Vas bien en '+c.name,'Te quedan '+money(c.budget-s));return}}
 toast('Guardado ✔')}
function delTx(){S.tx=S.tx.filter(x=>x.id!==F.eid);save();closeSheet();render();toast('Movimiento eliminado')}
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
